name: Build & Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # macOS (ARM & Intel)
          - os: darwin
            arch: arm64
            name: macos-arm64
          - os: darwin
            arch: amd64
            name: macos-x86_64
          # Linux (x86, ARM64, ARMv7)
          - os: linux
            arch: amd64
            name: linux
          - os: linux
            arch: arm64
            name: linux-arm64
          - os: linux
            arch: arm
            name: linux-arm32
            goarm: "7"
          # Windows
          - os: windows
            arch: amd64
            name: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export GOARM=${{ matrix.goarm || '' }}
          out="spgtty-${{ matrix.name }}$ext"
          echo "Building ${out} (GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM)"
          go build -v -o "${out}" .  # ← Hier den Pfad zu deinem MAIN-Paket angeben!

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spgtty-${{ matrix.name }}
          path: "spgtty-${{ matrix.name }}*" # ← Binaries sind im Root!

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # NUR auf main!
    if: github.ref_name == 'main' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
