name: Go Build & Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # macOS (ARM & Intel)
          - os: darwin
            arch: arm64
            name: macos-arm64
          - os: darwin
            arch: amd64
            name: macos-x86_64
          # Linux (x86, ARM64, ARMv7)
          - os: linux
            arch: amd64
            name: linux
          - os: linux
            arch: arm64
            name: linux-arm64
          # Windows
          - os: windows
            arch: amd64
            name: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true # ← Caching für schnellere Builds!

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export GOARM=${{ matrix.goarm || '' }}
          out="spgtty-${{ matrix.name }}$ext"
          echo "Building ${out} (GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM)"
          go build -v -o "${out}" .  # ← Hier den Pfad zu deinem MAIN-Paket angeben!

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spgtty-${{ matrix.name }}
          path: |
            spgtty-${{ matrix.name }}
            spgtty-${{ matrix.name }}.exe  # Falls Windows

  test:
    needs: build # Tests erst nach dem Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true
      - run: go test -v ./...
