name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"] # Nur auf dem main-Branch

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # macOS (ARM & Intel)
          - os: darwin
            arch: arm64
            name: macos-arm64
          - os: darwin
            arch: amd64
            name: macos-x86_64

          # Linux (x86, ARM64, ARMv7)
          - os: linux
            arch: amd64
            name: linux
          - os: linux
            arch: arm64
            name: linux-arm64
          - os: linux
            arch: arm
            name: linux-arm32
            goarm: "7"

          # Windows
          - os: windows
            arch: amd64
            name: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - run: |
          cmd="GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }}"
          ${{ matrix.goarm && format('cmd+=" GOARM={0}"', matrix.goarm) || '' }}
          $cmd go build -o spgtty-${{ matrix.name }} -ldflags="-s -w" ./...

      - uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: spgtty-${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
