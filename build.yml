name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            name: macos-arm64
          - os: darwin
            arch: amd64
            name: macos-x86_64
          - os: linux
            arch: amd64
            name: linux
          - os: linux
            arch: arm64
            name: linux-arm64
          - os: linux
            arch: arm
            name: linux-arm32
            goarm: "7"
          - os: windows
            arch: amd64
            name: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Show go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Build
        # Use bash so the same script works across runners (Windows runners provide Git Bash)
        shell: bash
        run: |
          set -euo pipefail
          # Determine output extension for windows
          if [ "${{ matrix.os }}" = "windows" ]; then
            ext=".exe"
          else
            ext=""
          fi
          # GOARM may be empty for many matrix entries; that's okay
          export GOOS=${{ matrix.os }}
          export GOARCH=${{ matrix.arch }}
          export GOARM=${{ matrix.goarm || "" }}
          out="spgtty-${{ matrix.name }}${ext}"
          echo "Building ${out} (GOOS=$GOOS GOARCH=$GOARCH GOARM=$GOARM)"
          go build -v -o "${out}" -ldflags="-s -w" ./...

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spgtty-${{ matrix.name }}
          path: spgtty-${{ matrix.name }}*

  release:
    # run release only for tag pushes; depend on build so artifacts from all matrix jobs are available
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub release and upload files
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
